syntax = "proto3";

package grading_mini.proto;

import "google/protobuf/any.proto";

message MetricFrameOutput {
  int64 frame_id = 1;
  int64 timestamp_us = 2;

  oneof value_one_of {
    bool bool_value = 10;
    double double_value = 11;
  }

  google.protobuf.Any custom_info = 20;
}

message PdmsSubScore {
  string name = 1;
  double score = 2;
}

message MetricSummary {
  string metric_name = 1;
  bool passed = 2;
  string detail = 3;
  optional double score = 4;
  repeated PdmsSubScore subscores = 5;
}

message GradingReport {
  bool overall_passed = 1;
  repeated MetricSummary summaries = 2;
  optional double pdms_score = 3;
  repeated PdmsSubScore pdms_subscores = 4;
}

message MetricFrameVerdict {
  int64 frame_id = 1;
  int64 timestamp_us = 2;
  bool passed = 3;
  double speed_mps = 4;
  optional bool collided = 5;
  string log_line = 6;
  google.protobuf.Any custom_info = 7;
}

message MetricDetailReport {
  string metric_name = 1;
  bool passed = 2;
  string summary = 3;
  repeated MetricFrameVerdict frames = 4;
}
